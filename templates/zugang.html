<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growatt Zugang</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Eigene CSS-Dateien -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
 body {
    background-color: #95a6b8;
    padding-top: 5px;
}
        .container {
            max-width: 450px; /* optimal für Handy */
        }
        h2 {
            font-size: 1.5rem;
        }
        .form-label {
            font-weight: 500;
        }
        .btn-primary, .btn-secondary {
            width: 100%;
            margin-top: 5px;
        }
        input.form-control {
            font-size: 1rem;
        }
        
    </style>
</head>
<body>

<div class="container">
    <h2 class="mb-0 text-center">Zugangsdaten</h2>
    <form method="POST" onsubmit="return confirm('Möchten Sie die Änderungen wirklich speichern?');">
      
<div class="row mb-0">
    <div class="col-8">
        <label for="ip_smart" class="col-form-label">IP SML : 192.168.178.</label>
    </div>
    <div class="col-4">
        <input type="number"
           class="form-control"
           id="ip_smart"
           name="ip_smart"
           min="1"
           max="255"
           step="1"
          value="{{ zugang.get('ip_smart',123) }}">
    </div>
</div>       

<div class="row mb-0">
    <div class="col-8">
        <label for="ip_tasmota" class="col-form-label">IP Tasmota : 192.168.178.</label>
    </div>
    <div class="col-4">
        <input type="number"
           class="form-control"
           id="ip_tasmota"
           name="ip_tasmota"
           min="1"
           max="255"
           step="1"
           value="{{ zugang.get('ip_tasmota',41) }}">
    </div>
</div> 

<div class="row mb-0">
    <div class="col-8">
        <label for="ip_hms" class="col-form-label">IP HMS_DTU : 192.168.178.</label>
    </div>
    <div class="col-4">
        <input type="number"
           class="form-control"
           id="ip_hms"
           name="ip_hms"
           min="1"
           max="255"
           step="1"
           value="{{ zugang.get('ip_hms',44) }}">
    </div>
</div> 


        <div class="row mb-0">
    <div class="col-4">
        <label for="username" class="col-form-label">Username</label>
    </div>
    <div class="col-8">
        <input type="text"
               class="form-control form-control-sm"
               id="username"
               name="username"
               value="{{ zugang.get('username') }}">

    </div>
</div>

<div class="row mb-0">
    <div class="col-4">
        <label for="password" class="col-form-label"> Password </label>
    </div>
    <div class="col-8">
        <input type="text"
               class="form-control form-control-sm"
               id="password"
               name="password"
               value="{{ zugang.get('password') }}">
    </div>
</div>

<div class="row mb-0">
    <div class="col-4">
        <label for="deviceSn" class="col-form-label">
            Growatt Sn:
        </label>
    </div>
    <div class="col-8">
        <input type="text"
               class="form-control form-control-sm"
               id="deviceSn"
               name="deviceSn"
               value="{{ zugang.get('deviceSn')}}">
    </div>
</div>

<div class="row mb-0">
    <div class="col-2">
        <label for="token" class="col-form-label">
            Token:
        </label>
    </div>
    <div class="col-10">
        <input type="text"
               class="form-control form-control-sm"
               id="token"
               name="token"
               value="{{ zugang.get('token')}}">
    </div>
</div>

        <div class="mb-0">
            <label for="solax_c_url" class="form-label">Solax Cloud URL: </label>
            <input type="text" class="form-control" id="solax_c_url"
             name="solax_c_url" 
             value="{{ zugang.get('solax_c_url') }}">
        </div>

<div class="row mb-0">
    <div class="col-3">
        <label for="solax_c_sn" class="col-form-label">
            Solax SN:
        </label>
    </div>
    <div class="col-9">
        <input type="text"
               class="form-control form-control-sm"
               id="solax_c_sn"
               name="solax_c_sn"
               value="{{ zugang.get('solax_c_sn') }}">
    </div>
</div>

<div class="row mb-0">
    <div class="col-3">
        <label for="solax_c_tokenId" class="col-form-label">Token:</label>
    </div>
    <div class="col-9">
        <input type="text"
               class="form-control form-control-sm"
               id="solax_c_tokenId"
               name="solax_c_tokenId"
               value="{{ zugang.get('solax_c_tokenId')}}">
    </div>
</div>

<div class="row mb-0">
    <div class="col-3">
        <label for="solax_l_url" class="col-form-label">
            Lokal:
        </label>
    </div>
    <div class="col-9">
        <input type="text"
               class="form-control form-control-sm"
               id="solax_l_url"
               name="solax_l_url"
               value="{{ zugang.get('solax_l_url') }}">
    </div>
</div>

<div class="row g-2 mt-3">
    <div class="col-6">
        <button type="submit" class="btn btn-primary btn-lg w-100">Speichern</button>
    </div>
    <div class="col-6">
        <button type="button" class="btn btn-secondary btn-lg w-100" onclick="window.history.back();">Zurück</button>
    </div>
</div>
    </form>
</div>
</body>
</html>
