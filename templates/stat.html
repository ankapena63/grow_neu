<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Status</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
<style>
    body {                background: #95a6b8;    }
    .status-card {        border-radius: 10px;  transition: 0.3s;}
    .status-icon {        font-size: 28px; min-width: 40px;}
    .status-ok {          background-color: #d1e7dd;   }
    .status-warn {        background-color: #fff3cd;    }
    .status-error {       background-color: #f8d7da;   }
    .status-zeit {        font-size: 0.9rem;    }
    .status-alter {       font-size: 1.1rem;       font-weight: bold;    }
</style>
</head>
<body>
<div class="container-fluid py-2">
    <div class="card mb-2">
        <div class="card-header bg-dark text-white">
            <div class="d-flex justify-content-between align-items-center">
                 <button onclick="window.location.href='/'">🔄 🏠 Haupt</button>
                <strong>📡 System Status</strong>
                <span id="aktualisiert">--:--:--</span>
            </div>
        </div>
    </div>
    <div id="statusContainer"></div>
</div>
<script>
const namen={
    akku_login:"🔐 Akku Login",
    akku_token:"🔑 Akku Token",
    hms:"☀️ HMS",
    solax_c:"☁️ Solax Cloud",
    solax_l:"🏠 Solax Local",
    strom:"⚡Strom",
    dose:"🔌Dose"
};
function statusAnzeigen(statusHtml){
    const c=document.getElementById("statusContainer");
    c.innerHTML="";
    const jetzt=Date.now();
    const reihenfolge=[
        "akku_login","akku_token","hms",
        "solax_c","solax_l","strom","dose"
    ];
    for(const geraet of reihenfolge){
        const daten=statusHtml[geraet];
        if(!daten) continue;
        const takt=Number(daten.takt)||0;
        let alter=null;
        if(daten.zeit_meine){
            const zeit=new Date(daten.zeit_meine.replace(" ","T"));
            if(!isNaN(zeit)) alter=Math.max(0,(jetzt-zeit)/1000);
        }

        let klasse="status-error",icon="🔴",text="Keine Daten";
        if(alter!==null){
            if(alter<=takt*1.5){
                klasse="status-ok"; icon="🟢"; text="OK";
            }else if(alter<=takt*3){
                klasse="status-warn"; icon="🟡"; text="Verzögert";
            }else{
                klasse="status-error"; icon="🔴"; text="Zu alt";
            }
        }
        const card=document.createElement("div");
        card.className=`card status-card ${klasse}`;

        card.innerHTML=`
            <div class="card-body py-2">
                <div class="d-flex align-items-center justify-content-between">
                    <div>
                        <span class="status-icon">${icon}</span>
                        <strong>${namen[geraet]||geraet}</strong>
                        <div class="status-zeit">${text}</div>
                    </div>
                    <div class="text-end">
                        <div>Takt: <strong>${takt}s</strong></div>
                        <div class="status-alter">
                            ${alter!==null?formatAlter(alter):"--"}
                        </div>
                    </div>
                </div>
            </div>`;

        c.appendChild(card);
    }
}
function formatAlter(s){
    s=Math.floor(s);
    if(s<60)return s+" s";
    if(s<3600)return Math.floor(s/60)+" min "+s%60+" s";
    return Math.floor(s/3600)+" h "+Math.floor(s%3600/60)+" min";
}
async function ladeStatus(){
    try{
        const r=await fetch("/api/stat");
        if(!r.ok)throw new Error("HTTP "+r.status);
        statusAnzeigen(await r.json());
        document.getElementById("aktualisiert").textContent=
            new Date().toLocaleTimeString("de-DE");
    }catch(e){
        console.error("Status Fehler:",e);
        document.getElementById("statusContainer").innerHTML=
            `<div class="alert alert-danger">🔴 Statusdaten konnten nicht geladen werden.<br>
            <small>${e.message}</small></div>`;
    }
}
ladeStatus();
setInterval(ladeStatus,2000);
</script>
</body>
</html>
