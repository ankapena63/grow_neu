<div
    id="kochen_btn"
    class="kochen-button p-2 rounded text-white fw-bold text-center"
    onclick="kochenClick()"
>
    🍳 KOCHEN Aus
</div>
<div
    id="kochen_modal"
    class="kochen-modal"
>
    <h5>🍳 Kochen einstellen</h5>
<!-- ZEIT -->
<div class="mt-3 text-center">
    <div
        id="zeit_knob"
        class="zeit-knob"
        ontouchmove="rotateKnob(event)"
        onmousemove="mouseRotate(event)"
    >
        <div class="zeit-inner">
            <div
                id="m_zeit_t"
                class="fw-bold text-success kochen-time-value"
            >
                0
            </div>
            <div class="small text-muted">
                Minuten
            </div>
        </div>
    </div>
    <!-- VERSTECKTES INPUT -->
    <input
        type="hidden"
        id="m_zeit"
        value="0"
    >
    <!-- FEIN EINSTELLUNG -->
<div class="d-flex justify-content-center gap-3 mt-2">
    <button
        type="button"
        class="btn btn-secondary btn-sm"
        onclick="setKnobValue(knobValue-1)"
    >
        −1
    </button>
    <button
        type="button"
        class="btn btn-secondary btn-sm"
        onclick="setKnobValue(knobValue+1)"
    >
        +1
    </button>
</div>
</div>
<!-- SOC + LEISTUNG -->
<div class="row mt-2 g-2">
    <!-- SOC -->
    <div class="col-6">
        <div class="input-group input-group-sm">
            <span class="input-group-text">
                🔋 SOC
            </span>
            <input
                type="number"
                id="m_soc"
                class="form-control text-center"
                value="30"
                min="30"
                max="90"
            >
            <span class="input-group-text">%</span>
        </div>
    </div>
    <!-- LEISTUNG -->
    <div class="col-6">
        <div class="input-group input-group-sm">
            <span class="input-group-text">
                ⚡
            </span>
            <input
                type="number"
                id="m_watt"
                class="form-control text-center"
                value="800"
                min="100"
                max="3000"
            >
            <span class="input-group-text">W</span>
        </div>
    </div>
</div>
<div class="d-flex justify-content-between gap-2 mt-3">
    <button
        type="button"
        onclick="startKochen()"
        class="btn btn-success kochen-action-button"
    >
        START
    </button>
    <button
        type="button"
        onclick="closeKochenModal()"
        class="btn btn-secondary kochen-action-button"
    >
        Abbrechen
    </button>
</div>
</div>
   
<script src="{{ url_for('static', filename='kochen.js') }}"></script>
