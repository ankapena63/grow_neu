<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
<title>System-Log</title>
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body class="bg-secondary">
<div class="container-fluid p-2">
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <a href="/" class="btn btn-secondary btn-sm">
            ⬅️ Zurück
        </a>
        <strong>🛠️ System-Log</strong>

        <select id="logLevel"
                class="form-select form-select-sm"
                style="width:120px;">
            <option value="ERROR">ERROR</option>
            <option value="WARNING">WARNING</option>
            <option value="INFO">INFO</option>
            <option value="DEBUG">DEBUG</option>
        </select>
    </div>
    <div class="card-body p-1">
        <pre id="logFenster"
             style="
                height: calc(100vh - 90px);
                overflow-y: auto;
                margin: 0;
                padding: 8px;
                font-size: 12px;
                white-space: pre-wrap;
             "></pre>
    </div>
</div>
</div>

<script>

async function aktualisiereLog() {
    try {
        const response = await fetch("/api/log");
        if (!response.ok) {
            console.error(
                "Log-Abfrage fehlgeschlagen:",
                response.status
            );
            return;
        }
        const data = await response.json();
        console.log("Anzahl Logs:", (data.log || []).length);
        const fenster = document.getElementById("logFenster");
        const select = document.getElementById("logLevel");

        if (!fenster) {
            console.error("Element #logFenster nicht gefunden");
            return;
        }
        // Prüfen, ob der Benutzer bereits unten ist
        const warAmEnde =
            fenster.scrollTop + fenster.clientHeight >=
            fenster.scrollHeight - 10;
        // Log anzeigen
        fenster.textContent =
            (data.log || []).join("\n");
        // Nur automatisch nach unten scrollen,
        // wenn der Benutzer vorher bereits unten war
        if (warAmEnde) {
            fenster.scrollTop = fenster.scrollHeight;
        }
        // Aktuelles Log-Level vom Server übernehmen
        if (select && data.level !== undefined) {
            const levelNamen = {
                10: "DEBUG",
                20: "INFO",
                30: "WARNING",
                40: "ERROR"
            };
            const aktuellesLevel =
                levelNamen[data.level];

            if (aktuellesLevel) {
                select.value = aktuellesLevel;
            }
        }
    } catch (err) {
        console.error(
            "Fehler beim Laden des Logs:",
            err
        );
    }
}
const logLevel = document.getElementById("logLevel");
if (logLevel) {
    logLevel.addEventListener(
        "change",
        async function () {
            try {
                const response = await fetch(
                    "/api/log_level",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            level: this.value
                        })
                    }
                );
                if (!response.ok) {
                    console.error(
                        "Log-Level konnte nicht geändert werden:",
                        response.status
                    );
                    return;
                }
                const data = await response.json();
                console.log(
                    "Neues Log-Level:",
                    data.level
                );
                await aktualisiereLog();
            } catch (err) {

                console.error(
                    "Fehler beim Ändern des Log-Levels:",
                    err
                );
            }
        }
    );
}
// Log alle 4 Sekunden aktualisieren
setInterval(
    aktualisiereLog,
    4000
);
aktualisiereLog();
</script>
</body>
</html>
